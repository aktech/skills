<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch video</title>
<link rel="stylesheet" href="/__v/page/page.css">
<script type="importmap">
{ "imports": { "three": "/__v/three/build/three.module.js", "three/addons/": "/__v/three/examples/jsm/" } }
</script>
</head>
<body>
  <!-- Product: wallpaper + browser window holding the real product. The camera moves #stage. -->
  <div id="stage">
    <div id="wallpaper"></div>
    <div id="window">
      <div id="chrome">
        <span class="light red"></span><span class="light yellow"></span><span class="light green"></span>
        <div id="url"><svg viewBox="0 0 16 16" width="11" height="11"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5A1 1 0 0 1 13 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h.5Zm1.5 0h4V5a2 2 0 0 0-4 0v2Z" fill="currentColor"/></svg><span id="urltext"></span></div>
      </div>
      <div id="viewport"><iframe id="app" name="app"></iframe><iframe id="second" name="second"></iframe></div>
    </div>
    <div id="hl"><i class="hl-wash"></i><i class="hl-bar"></i></div>
    <svg id="cursor" viewBox="0 0 28 28" width="28" height="28">
      <path d="M8.2 4.6v17.3l4.1-4 2.6 6.1 3.1-1.3-2.6-6h5.8L8.2 4.6Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Confetti over the product, in screen space. -->
  <canvas id="confetti" width="3840" height="2160"></canvas>

  <!-- Headline cards. -->
  <div id="card"><div id="headline"></div></div>

  <!-- Logo intro and outro. -->
  <div id="logo">
    <canvas id="gl"></canvas>
    <div id="wordmark"></div>
  </div>

  <!-- Designed cards: a statement with a quiet line under it, and the credit. -->
  <div id="designed">
    <div id="statement" class="dcard">
      <div class="shead"><span id="stodo"></span></div>
      <div class="ssub"></div>
    </div>
    <div id="creditcard" class="dcard">
      <div class="from"><span id="fromodo"></span></div>
      <div class="makers"></div>
      <div class="web"><span id="webtext"></span><span id="caret"></span></div>
    </div>
  </div>

  <div id="apps"></div>
  <div id="globe"></div>

  <script type="module" src="/__v/page/page.js"></script>
</body>
</html>
